<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Banco de caligrafias — Upload</title>
</head>
<body>
  <h1>Enviar foto de uma folha escrita à mão</h1>

  {% if erro %}
    <p class="erro" role="alert">{{ erro }}</p>
  {% endif %}

  {% if request.args.get('enviado') %}
    <p class="sucesso">Upload recebido para a caligrafia "{{ request.args.get('enviado') }}".</p>
  {% endif %}

  <form method="post" action="{{ url_for('upload.enviar') }}" enctype="multipart/form-data">
    <label for="nome">Nome da caligrafia</label>
    <input type="text" id="nome" name="nome" required>

    <label for="arquivo">Foto da folha (JPG ou PNG)</label>
    <input type="file" id="arquivo" name="arquivo" accept=".jpg,.jpeg,.png" required>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
