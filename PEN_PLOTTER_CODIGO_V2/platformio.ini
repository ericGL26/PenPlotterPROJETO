; =============================================================================
; PlatformIO Project Configuration — ESP32 CoreXY Plotter Firmware
; =============================================================================

[env:esp32doit-devkit-v1]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino

; --- Filesystem (LittleFS para index.html) ---
board_build.filesystem = littlefs

; --- Monitor ---
monitor_speed = 115200

; --- Build Flags ---
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_FREERTOS_UNICORE=0

; --- Dependências ---
lib_deps =
    ; WebSocket server para ESP32
    links2004/WebSockets@^2.4.1
    ; ArduinoOTA já incluso no framework espressif32

; --- Upload ---
; upload_port = COM3   ; descomente e ajuste se necessário
