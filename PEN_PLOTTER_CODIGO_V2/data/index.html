<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 CoreXY Plotter</title>
<meta name="description" content="Interface de controle do plotter CoreXY baseado em ESP32 — sem dependências externas.">
<style>
  /* ========================================================
     Design System
  ======================================================== */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg:         #0d0f14;
    --surface:    #151820;
    --surface2:   #1c202c;
    --border:     #272b38;
    --accent:     #4f8ef7;
    --accent-dim: #2a4a8a;
    --green:      #2dd4a0;
    --yellow:     #f5c842;
    --red:        #f25c54;
    --text:       #e2e8f0;
    --muted:      #64748b;
    --radius:     12px;
    --radius-sm:  8px;
    --shadow:     0 4px 24px rgba(0,0,0,0.5);
    --transition: 0.18s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(79,142,247,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(45,212,160,0.04) 0%, transparent 60%);
  }

  /* ========================================================
     Header
  ======================================================== */
  .header {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .header-title {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-title svg { color: var(--accent); }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--green) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

  /* ========================================================
     Connection bar
  ======================================================== */
  .conn-bar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--muted);
    transition: background var(--transition), box-shadow var(--transition);
  }
  .status-dot.connected {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse-dot 2s infinite;
  }
  .status-dot.error { background: var(--red); box-shadow: 0 0 8px var(--red); }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.5; }
  }

  .conn-label { font-size: 0.82rem; color: var(--muted); }
  .conn-label span { color: var(--text); font-weight: 500; }

  /* ========================================================
     Main grid
  ======================================================== */
  .grid {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 16px;
  }

  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* ========================================================
     Cards
  ======================================================== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .card-title {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* ========================================================
     Status panel
  ======================================================== */
  .status-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    text-align: center;
  }

  .stat-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 500; margin-top: 4px; color: var(--text); }
  .stat-value.highlight { color: var(--accent); }
  .stat-value.state-idle    { color: var(--muted); }
  .stat-value.state-running { color: var(--green); }
  .stat-value.state-paused  { color: var(--yellow); }
  .stat-value.state-error   { color: var(--red); }

  /* ========================================================
     Progress bar
  ======================================================== */
  .progress-wrap { margin-bottom: 4px; }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .progress-label { font-size: 0.72rem; color: var(--muted); }
  .progress-pct   { font-size: 0.82rem; font-weight: 600; color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .progress-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 100px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent) 0%, var(--green) 100%);
    border-radius: 100px;
    transition: width 0.4s ease;
  }

  /* ========================================================
     Control buttons
  ======================================================== */
  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    outline: none;
  }

  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: #6aa0ff; box-shadow: 0 0 16px rgba(79,142,247,0.4); }

  .btn-success {
    background: rgba(45,212,160,0.15);
    color: var(--green);
    border: 1px solid rgba(45,212,160,0.3);
  }
  .btn-success:hover { background: rgba(45,212,160,0.25); }

  .btn-warning {
    background: rgba(245,200,66,0.12);
    color: var(--yellow);
    border: 1px solid rgba(245,200,66,0.3);
  }
  .btn-warning:hover { background: rgba(245,200,66,0.22); }

  .btn-danger {
    background: rgba(242,92,84,0.12);
    color: var(--red);
    border: 1px solid rgba(242,92,84,0.3);
  }
  .btn-danger:hover { background: rgba(242,92,84,0.22); }

  .btn-ghost {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }

  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none !important;
  }

  /* ========================================================
     File upload
  ======================================================== */
  .file-drop {
    border: 2px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
    margin-bottom: 12px;
    position: relative;
  }

  .file-drop:hover, .file-drop.drag-over {
    border-color: var(--accent);
    background: rgba(79,142,247,0.05);
  }

  .file-drop input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .file-icon { font-size: 1.8rem; margin-bottom: 6px; }
  .file-hint { font-size: 0.78rem; color: var(--muted); }
  .file-name { font-size: 0.82rem; color: var(--green); font-weight: 500; margin-top: 6px; font-family: 'JetBrains Mono', monospace; }

  /* ========================================================
     Console
  ======================================================== */
  .console {
    background: #080a0e;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    height: 280px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    line-height: 1.6;
    scroll-behavior: smooth;
  }

  .console::-webkit-scrollbar { width: 4px; }
  .console::-webkit-scrollbar-track { background: transparent; }
  .console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }

  .log-line { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 2px; }
  .log-time  { color: var(--muted); flex-shrink: 0; user-select: none; }
  .log-send  { color: var(--accent); }
  .log-recv  { color: var(--green); }
  .log-error { color: var(--red); }
  .log-info  { color: var(--yellow); }
  .log-arrow { flex-shrink: 0; }

  .console-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  /* ========================================================
     IP badge
  ======================================================== */
  .ip-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 4px 10px;
  }

  /* ========================================================
     Animations
  ======================================================== */
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card { animation: fade-in 0.3s ease; }
</style>
</head>
<body>

<!-- ================================================================ HEADER -->
<header class="header">
  <div class="header-title">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
      <path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/>
    </svg>
    <div>
      <h1>CoreXY Plotter</h1>
      <div class="subtitle">ESP32 · WebSocket · Firmware v1.0</div>
    </div>
  </div>

  <div class="conn-bar">
    <div id="statusDot" class="status-dot"></div>
    <div class="conn-label">
      <span id="connLabel">Desconectado</span>
    </div>
    <button id="btnConnect"    class="btn btn-primary"  onclick="connect()">Conectar</button>
    <button id="btnDisconnect" class="btn btn-ghost"    onclick="disconnect()" style="display:none">Desconectar</button>
  </div>
</header>

<!-- ================================================================ MAIN -->
<div class="grid">

  <!-- ============================================================ COLUNA ESQUERDA -->
  <div style="display:flex;flex-direction:column;gap:16px;">

    <!-- Status -->
    <div class="card">
      <div class="card-title">Status da Máquina</div>
      <div class="status-grid">
        <div class="stat-box">
          <div class="stat-label">Estado</div>
          <div id="stateVal" class="stat-value state-idle">IDLE</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">X (mm)</div>
          <div id="posX" class="stat-value highlight">0.00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Y (mm)</div>
          <div id="posY" class="stat-value highlight">0.00</div>
        </div>
        <div class="stat-box" style="grid-column: 1 / -1;">
          <div class="stat-label">Feed rate (mm/min)</div>
          <div id="feedVal" class="stat-value">—</div>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-header">
          <span class="progress-label">Progresso do arquivo</span>
          <span id="progressPct" class="progress-pct">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- Console -->
    <div class="card">
      <div class="console-toolbar">
        <div class="card-title" style="margin:0">Console</div>
        <button class="btn btn-ghost" onclick="clearConsole()" style="padding:4px 10px;font-size:0.75rem;">Limpar</button>
      </div>
      <div id="console" class="console"></div>
    </div>

  </div>

  <!-- ============================================================ COLUNA DIREITA -->
  <div style="display:flex;flex-direction:column;gap:16px;">

    <!-- Arquivo -->
    <div class="card">
      <div class="card-title">Arquivo G-code</div>
      <div id="fileDrop" class="file-drop">
        <input type="file" id="fileInput" accept=".gcode,.nc,.ngc,.tap,.gc" onchange="onFileSelect(event)">
        <div class="file-icon">📁</div>
        <div class="file-hint">Clique ou arraste um arquivo .gcode</div>
        <div id="fileName" class="file-name"></div>
      </div>
    </div>

    <!-- Controles -->
    <div class="card">
      <div class="card-title">Controles</div>
      <div class="btn-group">
        <button id="btnRun"    class="btn btn-success" onclick="sendCmd('run')"    disabled>▶ Executar</button>
        <button id="btnPause"  class="btn btn-warning" onclick="sendCmd('pause')"  disabled>⏸ Pausar</button>
        <button id="btnResume" class="btn btn-success" onclick="sendCmd('resume')" disabled style="display:none">▶ Continuar</button>
        <button id="btnCancel" class="btn btn-danger"  onclick="sendCmd('cancel')" disabled>⏹ Cancelar</button>
      </div>
      <div class="btn-group">
        <button class="btn btn-ghost" onclick="sendCmd('home')"   id="btnHome">⌂ Home</button>
        <button class="btn btn-ghost" onclick="sendCmd('unlock')" id="btnUnlock">🔓 Unlock</button>
        <button class="btn btn-ghost" onclick="sendCmd('status')" id="btnStatus">↺ Status</button>
      </div>
    </div>

    <!-- Envio manual -->
    <div class="card">
      <div class="card-title">Comando Manual</div>
      <div style="display:flex;gap:8px;">
        <input id="manualInput" type="text" placeholder="G1 X10 Y20 F3000"
          style="flex:1;background:var(--surface2);border:1px solid var(--border);
                 border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);
                 font-family:'JetBrains Mono',monospace;font-size:0.82rem;outline:none;
                 transition:border-color var(--transition);"
          onkeydown="if(event.key==='Enter')sendManual()"
          onfocus="this.style.borderColor='var(--accent)'"
          onblur="this.style.borderColor='var(--border)'">
        <button class="btn btn-primary" onclick="sendManual()">Enviar</button>
      </div>
    </div>

    <!-- IP -->
    <div style="text-align:center;">
      <span class="ip-badge" id="ipBadge">ws://&lt;IP&gt;:81</span>
    </div>

  </div><!-- fim coluna direita -->
</div><!-- fim grid -->

<!-- ================================================================ JAVASCRIPT -->
<script>
// =============================================================================
// Estado da aplicação
// =============================================================================
let ws          = null;
let connected   = false;
let gcodeLines  = [];
let currentLine = 0;
let streaming   = false;
let waitingAck  = false;
let paused      = false;
let machineState = 'idle';

const WS_PORT   = 81;
const WS_HOST   = window.location.hostname || '192.168.1.100';

// =============================================================================
// WebSocket
// =============================================================================
function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) return;

  const url = `ws://${WS_HOST}:${WS_PORT}`;
  log('info', `Conectando a ${url}…`);

  ws = new WebSocket(url);

  ws.onopen = () => {
    connected = true;
    updateConnectionUI(true);
    log('recv', 'Conectado ao ESP32.');
    document.getElementById('ipBadge').textContent = url;
  };

  ws.onclose = () => {
    connected = false;
    streaming = false;
    waitingAck = false;
    updateConnectionUI(false);
    log('error', 'Conexão encerrada.');
  };

  ws.onerror = (e) => {
    log('error', 'Erro no WebSocket: ' + (e.message || 'desconhecido'));
  };

  ws.onmessage = (event) => {
    handleMessage(event.data);
  };
}

function disconnect() {
  if (ws) { ws.close(); ws = null; }
}

// =============================================================================
// Protocolo de mensagens recebidas
// =============================================================================
function handleMessage(msg) {
  msg = msg.trim();

  if (msg === 'ok') {
    // ACK: linha aceita — envia a próxima
    waitingAck = false;
    currentLine++;
    updateProgress();
    if (streaming && !paused) sendNextLine();
    return;
  }

  if (msg === 'busy') {
    // Fila cheia — aguarda um pouco e tenta de novo
    setTimeout(() => { if (streaming && !paused && !waitingAck) sendNextLine(); }, 200);
    return;
  }

  if (msg === 'eof') {
    streaming = false;
    waitingAck = false;
    log('info', '✓ Arquivo concluído.');
    updateProgressBar(100);
    updateControls();
    return;
  }

  if (msg.startsWith('pos:')) {
    const parts = msg.substring(4).split(',');
    parts.forEach(p => {
      const [k, v] = p.split('=');
      if (k === 'x') document.getElementById('posX').textContent = parseFloat(v).toFixed(2);
      if (k === 'y') document.getElementById('posY').textContent = parseFloat(v).toFixed(2);
    });
    return;
  }

  if (msg.startsWith('state:')) {
    machineState = msg.substring(6);
    updateStateUI(machineState);
    return;
  }

  if (msg.startsWith('progress:')) {
    updateProgressBar(parseInt(msg.substring(9)));
    return;
  }

  if (msg.startsWith('feed:')) {
    document.getElementById('feedVal').textContent =
      parseFloat(msg.substring(5)).toFixed(0) + ' mm/min';
    return;
  }

  if (msg.startsWith('error:')) {
    streaming = false;
    waitingAck = false;
    log('error', '✗ ' + msg);
    updateControls();
    return;
  }

  // Mensagem genérica
  log('recv', msg);
}

// =============================================================================
// Streamer linha a linha (modelo ACK)
// =============================================================================
function startStream() {
  if (!connected) { log('error', 'Não conectado.'); return; }
  if (gcodeLines.length === 0) { log('error', 'Nenhum arquivo carregado.'); return; }

  currentLine = 0;
  streaming   = true;
  waitingAck  = false;
  paused      = false;

  log('info', `Iniciando: ${gcodeLines.length} linhas.`);
  sendCmd('run');
  sendNextLine();
  updateControls();
}

function sendNextLine() {
  if (!streaming || waitingAck || paused) return;

  // Pula linhas vazias ou só comentários sem enviar ao firmware
  while (currentLine < gcodeLines.length) {
    const line = gcodeLines[currentLine].trim();
    if (line === '' || line.startsWith(';')) {
      currentLine++;
      updateProgress();
      continue;
    }
    break;
  }

  if (currentLine >= gcodeLines.length) {
    streaming = false;
    log('info', '✓ Todas as linhas enviadas.');
    updateControls();
    return;
  }

  const line = gcodeLines[currentLine].trim();
  log('send', `[${currentLine + 1}/${gcodeLines.length}] ${line}`);
  ws.send('gcode:' + line);
  waitingAck = true;
}

// =============================================================================
// Comandos de controle
// =============================================================================
function sendCmd(cmd) {
  if (!connected) { log('error', 'Não conectado.'); return; }

  if (cmd === 'pause')  { paused = true;  }
  if (cmd === 'resume') { paused = false; if (streaming) sendNextLine(); }
  if (cmd === 'cancel') { streaming = false; waitingAck = false; paused = false; }
  if (cmd === 'run' && gcodeLines.length > 0 && !streaming) {
    startStream(); return;
  }

  ws.send('cmd:' + cmd);
  log('send', 'cmd:' + cmd);
}

function sendManual() {
  if (!connected) { log('error', 'Não conectado.'); return; }
  const input = document.getElementById('manualInput');
  const line  = input.value.trim();
  if (!line) return;

  ws.send('gcode:' + line);
  log('send', line);
  input.value = '';
}

// =============================================================================
// Carregamento de arquivo
// =============================================================================
function onFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const content = e.target.result;
    gcodeLines = content.split('\n');
    currentLine = 0;
    streaming = false;
    waitingAck = false;

    document.getElementById('fileName').textContent = file.name;
    log('info', `Arquivo carregado: ${file.name} (${gcodeLines.length} linhas)`);
    updateProgress();
    updateControls();
  };
  reader.readAsText(file);
}

// Drag & drop
const fileDrop = document.getElementById('fileDrop');
fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('drag-over'); });
fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag-over'));
fileDrop.addEventListener('drop', e => {
  e.preventDefault();
  fileDrop.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) {
    document.getElementById('fileInput').files = e.dataTransfer.files;
    onFileSelect({ target: { files: e.dataTransfer.files } });
  }
});

// =============================================================================
// UI helpers
// =============================================================================
function updateConnectionUI(isConnected) {
  const dot   = document.getElementById('statusDot');
  const label = document.getElementById('connLabel');
  const btnC  = document.getElementById('btnConnect');
  const btnD  = document.getElementById('btnDisconnect');

  dot.className = 'status-dot ' + (isConnected ? 'connected' : '');
  label.textContent = isConnected ? 'Conectado' : 'Desconectado';
  btnC.style.display = isConnected ? 'none' : '';
  btnD.style.display = isConnected ? ''     : 'none';
  updateControls();
}

function updateStateUI(state) {
  const el = document.getElementById('stateVal');
  el.textContent  = state.toUpperCase();
  el.className    = 'stat-value state-' + state;

  if (state === 'paused') {
    document.getElementById('btnPause').style.display  = 'none';
    document.getElementById('btnResume').style.display = '';
  } else {
    document.getElementById('btnPause').style.display  = '';
    document.getElementById('btnResume').style.display = 'none';
  }
  updateControls();
}

function updateControls() {
  const hasFile    = gcodeLines.length > 0;
  const isRunning  = streaming;
  const isConnected = connected;

  setBtn('btnRun',    isConnected && hasFile && !isRunning);
  setBtn('btnPause',  isConnected && isRunning);
  setBtn('btnCancel', isConnected && isRunning);
  setBtn('btnResume', false); // controlado por updateStateUI
}

function setBtn(id, enabled) {
  document.getElementById(id).disabled = !enabled;
}

function updateProgress() {
  if (gcodeLines.length === 0) return;
  const pct = Math.round(currentLine / gcodeLines.length * 100);
  updateProgressBar(pct);
}

function updateProgressBar(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent  = pct + '%';
}

// =============================================================================
// Console
// =============================================================================
function log(type, msg) {
  const console = document.getElementById('console');
  const now = new Date();
  const time = now.toTimeString().slice(0,8);

  const line = document.createElement('div');
  line.className = 'log-line';

  const arrowMap = { send: '→', recv: '←', error: '✗', info: 'ℹ' };
  const classMap = { send: 'log-send', recv: 'log-recv', error: 'log-error', info: 'log-info' };

  line.innerHTML =
    `<span class="log-time">${time}</span>` +
    `<span class="log-arrow ${classMap[type] || ''}">${arrowMap[type] || '·'}</span>` +
    `<span class="${classMap[type] || ''}">${escapeHtml(msg)}</span>`;

  console.appendChild(line);
  // Mantém no máximo 200 linhas
  if (console.children.length > 200) console.removeChild(console.firstChild);
  console.scrollTop = console.scrollHeight;
}

function clearConsole() {
  document.getElementById('console').innerHTML = '';
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// =============================================================================
// Boot
// =============================================================================
log('info', 'Interface pronta. Clique em "Conectar" para iniciar.');
</script>
